[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "educelab-devices"
version = "0.1.0"
description = "Python APIs for EduceLab imaging hardware"
readme = "README.md"
authors = [{ name = "Seth Parker", email = "c.seth.parker@uky.edu" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["numpy>=2"]

# Each driver track adds its vendor SDK as an extra named for its backend.
[project.optional-dependencies]
foldio360 = ["bleak>=3.0.2"]
gphoto2 = ["gphoto2>=2.5; sys_platform != 'win32'", "Pillow>=10"]
serial = ["pyserial>=3.5"]
all = ["educelab-devices[foldio360,gphoto2,serial]"]

[project.scripts]
el-devices = "educelab.devices.app.cli:main"

[project.urls]
Homepage = "https://github.com/educelab/educelab-devices"
Repository = "https://github.com/educelab/educelab-devices"

[dependency-groups]
dev = ["mypy>=1.11", "Pillow>=10", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["educelab*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets driver tests import the shared contract suite as `contracts`.
pythonpath = ["tests"]
# Hardware tests are deselected by default; run them with `pytest -m hardware`.
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not hardware"]
markers = ["hardware: needs real hardware attached; never runs in CI"]

[tool.coverage.run]
source = ["educelab.devices"]
branch = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
